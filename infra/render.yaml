services:
  - type: web
    name: outsideweek-api
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: outsideweek
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_SERVICE_TOKEN
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:e2b
      - key: OVERPASS_BASE_URL
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: WEB_ORIGIN
        sync: false
